[dependencies]
  [dependencies.three]
    path = "../../../"
    output-type = "static"

[package]
  cjc-version = "1.1.0"
  compile-option = "-Woff unused -g -O0"
  description = "fxaa - quick approximate anti-aliasing pass"
  link-option = "-l user32 -l gdi32 -l winmm -l imm32 -l ole32 -l oleaut32 -l version -l uuid -l setupapi -l shell32 -l dinput8 -l hid"
  name = "fxaa"
  output-type = "executable"
  override-compile-option = ""
  src-dir = ""
  target-dir = ""
  version = "1.0.0"
  [package.package-configuration]

[target]
  [target.x86_64-w64-mingw32]
    link-option = "-L ../../../libs -l:libbgfx.a -l:libbimg.a -l:libbimg_capi.a -l:libbimg_decode.a -l:libbimg_encode.a -l:libbx.a -l:libcommon.a -l:libcrypto.a -l:libdefault.a -l:libdlbridge.a -l:libgcc_eh.a -l:libgeometryc_capi.a -l:libJolt.a -l:libjoltc.a -l:libjoltcd.a -l:libJoltd.a -l:liblegacy.a -l:libluajit.a -l:libminiaudio.a -l:libOpenAL32.a -l:libSDL3.a -l:libshaderc_capi.a -l:libssl.a -l:libstdc++.a -l:libtemplate.a -l:libtlsbridge.a"