[dependencies]
  [dependencies.three]
    path = "../../../"
    output-type = "static"

[package]
  cjc-version = "1.1.0"
  compile-option = "-Woff unused -g -O0"
  description = "sp_hemispherelight - HemisphereLight sky/ground gradient test with directional shadow"
  link-option = "-l user32 -l gdi32 -l winmm -l imm32 -l ole32 -l oleaut32 -l version -l uuid -l setupapi -l shell32 -l dinput8 -l hid"
  name = "sp_hemispherelight"
  output-type = "executable"
  override-compile-option = ""
  src-dir = ""
  target-dir = ""
  version = "1.0.0"
  [package.package-configuration]

[target]
  [target.x86_64-w64-mingw32]
    link-option = "-L ../../../libs @../../../libs/exclude.rsp -l:libtracyc.a -l:libimgui.a -l:libSDL3.a -l:libbimg_capi.a -l:libbimg_decode.a -l:libbimg_encode.a -l:libgeometryc_capi.a -l:libshaderc_capi.a -l:libbgfx.a -l:libbimg.a -l:libbx.a -l:libOpenAL32.a -l:libminiaudio.a -l:libjoltc.a -l:libJolt.a -l:libluajit.a -l:libtlsbridge.a -l:libssl.a -l:libcrypto.a -l:libcommon.a -l:libdefault.a -l:libc++.a -l:libunwind.a -lhid -luser32 -lgdi32 -lwinmm -limm32 -lole32 -loleaut32 -lversion -luuid -lsetupapi -lshell32 -ldinput8 -ld3d11 -ldxgi -ld3dcompiler -lavrt -ldsound -lws2_32 -lcrypt32 -ladvapi32 -lz -ldbghelp -lsecur32"
