name: three-windows

on:
  workflow_dispatch:
    inputs:
      product-type:
        description: "产物类型，留空=全量（动态+静态都编译）；可填 dynamic（仅动态）或 static（仅静态）"
        required: false
        default: ""
      cangjie-url:
        description: "仓颉 SDK（windows-x64 zip）下载链接，留空=使用默认 1.2.0 SDK"
        required: false
        default: "https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-windows-x64-1.2.0.zip&objectKey=6ab1eafae4bd101f57762f5e"
      native-libs-url-x86_64:
        description: "cxx 静态库包（windows/x86_64 release static zip），留空=使用默认"
        required: false
        default: "https://github.com/YQ-RZJ/three.cj/releases/download/v0.1.0/native-libs-windows-x86_64-release-static.zip"
      native-libs-url-arm64-v8a:
        description: "cxx 静态库包（windows/arm64-v8a release static zip）"
        required: false
        default: "https://github.com/YQ-RZJ/three.cj/releases/download/v0.1.0/native-libs-windows-arm64-v8a-release-static.zip"
      arches:
        description: "架构，逗号分隔：x86_64（留空=x86_64；arm64-v8a 无官方 SDK，暂不可用）"
        required: false
        default: "x86_64"

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      arches: ${{ steps.set.outputs.arches }}
    steps:
      - id: set
        run: |
          V="${{ inputs.arches }}"
          if [ -z "$V" ]; then V="x86_64"; fi
          echo "arches=[$(echo "$V" | awk -F',' '{for(i=1;i<=NF;i++){gsub(/ /,"",$i); printf "%s\"%s\"", (i>1?",":""), $i}}')]" >> "$GITHUB_OUTPUT"

  build:
    needs: config
    name: ${{ matrix.arch }}
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.config.outputs.arches) }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve native libs URL
        run: |
          case "${{ matrix.arch }}" in
            x86_64)    URL="${{ inputs.native-libs-url-x86_64 }}" ;;
            arm64-v8a) URL="${{ inputs.native-libs-url-arm64-v8a }}" ;;
          esac
          if [ -z "$URL" ]; then echo "[ERROR] 架构 ${{ matrix.arch }} 未提供 native-libs-url"; exit 1; fi
          echo "NATIVE_URL=$URL" >> "$GITHUB_ENV"
          # 宏包在宿主（windows x64）平台编译链接，需要宿主平台静态库
          echo "HOST_URL=${{ inputs.native-libs-url-x86_64 }}" >> "$GITHUB_ENV"

      - name: Install Cangjie SDK
        run: |
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/cangjie-sdk.zip "${{ inputs.cangjie-url }}"
          mkdir -p /c/cangjie-sdk && unzip -q /tmp/cangjie-sdk.zip -d /c/cangjie-sdk
          CJ_DIR=$(dirname "$(find /c/cangjie-sdk -maxdepth 3 -name envsetup.sh | head -1)")
          test -n "$CJ_DIR" || { echo "[ERROR] 未找到 envsetup.sh"; exit 1; }
          echo "CANGJIE_HOME=$CJ_DIR" >> "$GITHUB_ENV"
          echo "$CJ_DIR/bin" >> "$GITHUB_PATH"

      - name: Build three
        run: |
          source "$CANGJIE_HOME/envsetup.sh"
          cjc -v
          python .github/scripts/build_three.py \
            --product-type "${{ inputs.product-type }}" \
            --platform windows --arch ${{ matrix.arch }} \
            --native-url "$NATIVE_URL" \
            --host-url "$HOST_URL" --host-tag WIN_X64

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: three-windows-${{ matrix.arch }}
          path: dist/*
          retention-days: 30
