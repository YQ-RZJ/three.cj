name: three-macos

on:
  workflow_dispatch:
    inputs:
      product-type:
        description: "产物类型，留空=全量（动态+静态都编译）；可填 dynamic（仅动态）或 static（仅静态）"
        required: false
        default: ""
      cangjie-url:
        description: "仓颉 SDK（mac-aarch64 tar.gz）下载链接，如 cangjie-sdk-mac-aarch64-1.2.0.tar.gz"
        required: true
        default: "https://cangjie-lang.cn/v1/files/auth/downLoad?nsId=142267&fileName=cangjie-sdk-mac-aarch64-1.2.0.tar.gz&objectKey=6ab1e6451320215435b23d52"
      native-libs-url-x86_64:
        description: "cxx 静态库包（macos/x86_64 release static tar.gz）"
        required: true
        default: "https://github.com/YQ-RZJ/three.cj/releases/download/v0.1.0/native-libs-macos-x86_64-release-static.tar.gz"
      native-libs-url-arm64-v8a:
        description: "cxx 静态库包（macos/arm64-v8a release static tar.gz）"
        required: true
        default: "https://github.com/YQ-RZJ/three.cj/releases/download/v0.1.0/native-libs-macos-arm64-v8a-release-static.tar.gz"
      arches:
        description: "架构，逗号分隔：arm64-v8a（留空=arm64-v8a；x86_64 无官方 SDK，暂不可用）"
        required: false
        default: "arm64-v8a"

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      arches: ${{ steps.set.outputs.arches }}
    steps:
      - id: set
        run: |
          V="${{ inputs.arches }}"
          if [ -z "$V" ]; then V="arm64-v8a"; fi
          echo "arches=[$(echo "$V" | awk -F',' '{for(i=1;i<=NF;i++){gsub(/ /,"",$i); printf "%s\"%s\"", (i>1?",":""), $i}}')]" >> "$GITHUB_OUTPUT"

  build:
    needs: config
    name: ${{ matrix.arch }}
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.config.outputs.arches) }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve native libs URL
        run: |
          case "${{ matrix.arch }}" in
            x86_64)    URL="${{ inputs.native-libs-url-x86_64 }}" ;;
            arm64-v8a) URL="${{ inputs.native-libs-url-arm64-v8a }}" ;;
          esac
          if [ -z "$URL" ]; then echo "[ERROR] 架构 ${{ matrix.arch }} 未提供 native-libs-url"; exit 1; fi
          echo "NATIVE_URL=$URL" >> "$GITHUB_ENV"
          # runner 为 arm64，宏包在宿主（macos/arm64）编译链接；
          # 目标为 x86_64 时宿主库与目标库不同包，必须单独提供
          echo "HOST_URL=${{ inputs.native-libs-url-arm64-v8a }}" >> "$GITHUB_ENV"

      - name: Install Cangjie SDK
        run: |
          curl -fsSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/cangjie-sdk.tar.gz" "${{ inputs.cangjie-url }}"
          CJ_ROOT="$RUNNER_TEMP/cangjie-sdk"
          mkdir -p "$CJ_ROOT" && tar -xzf "$RUNNER_TEMP/cangjie-sdk.tar.gz" -C "$CJ_ROOT"
          CJ_SH=$(find "$CJ_ROOT" -type f -name envsetup.sh 2>/dev/null | head -1)
          if [ -z "$CJ_SH" ] || [ ! -f "$CJ_SH" ]; then
            echo "[ERROR] 未找到 envsetup.sh，解压内容："
            find "$CJ_ROOT" -maxdepth 3 | head -40
            exit 1
          fi
          CJ_DIR=$(dirname "$CJ_SH")
          echo "CANGJIE_HOME=$CJ_DIR" >> "$GITHUB_ENV"
          echo "$CJ_DIR/bin" >> "$GITHUB_PATH"

      # cxx 侧 darwin 静态库由 Xcode 14+ clang 编译（默认 -fobjc-msgsend-selector-stubs，
      # 目标文件含 _objc_msgSend$<sel> 未定义引用），需链接器合成 selector stub；
      # 仓颉 SDK 自带 ld64.lld 是 LLVM 15.0.4（该特性 LLVM 16 才有，llvm#56034），
      # 因此备份后软链到 Xcode 自带 ld（参数兼容，支持 stub 合成）。
      - name: Patch darwin linker (selector stubs support)
        run: |
          LLD="$CANGJIE_HOME/third_party/llvm/bin/ld64.lld"
          if [ -f "$LLD" ] && [ ! -f "$LLD.orig" ]; then
            mv "$LLD" "$LLD.orig"
            ln -s "$(xcrun -f ld)" "$LLD"
            echo "patched: $LLD -> $(xcrun -f ld)"
          fi

      - name: Build three
        run: |
          source "$CANGJIE_HOME/envsetup.sh"
          cjc -v
          python3 .github/scripts/build_three.py \
            --product-type "${{ inputs.product-type }}" \
            --platform macos --arch ${{ matrix.arch }} \
            --native-url "$NATIVE_URL" \
            --host-url "$HOST_URL" --host-tag MACOS_ARM64

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: three-macos-${{ matrix.arch }}
          path: dist/*
          retention-days: 30
